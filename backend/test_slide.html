<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            width: 1600px;
            height: 900px;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Noto Sans JP', sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 60px;
        }
        .title {
            font-size: 72px;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 2px 20px rgba(0,255,255,0.3);
            margin-bottom: 40px;
        }
        .subtitle {
            font-size: 36px;
            color: rgba(255,255,255,0.8);
            margin-bottom: 60px;
        }
        .points {
            display: flex;
            gap: 40px;
        }
        .point {
            flex: 1;
            background: rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            border: 1px solid rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
        }
        .point-title {
            font-size: 28px;
            font-weight: 600;
            color: #00ffff;
            margin-bottom: 20px;
        }
        .point-text {
            font-size: 20px;
            color: rgba(255,255,255,0.9);
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <h1 class="title">html-to-image テスト</h1>
    <p class="subtitle">Playwrightとの品質比較用サンプルスライド</p>
    <div class="points">
        <div class="point">
            <h3 class="point-title">グラデーション</h3>
            <p class="point-text">背景のグラデーションが正しく表示されるか確認</p>
        </div>
        <div class="point">
            <h3 class="point-title">シャドウ</h3>
            <p class="point-text">テキストシャドウと要素のシャドウが反映されるか</p>
        </div>
        <div class="point">
            <h3 class="point-title">Flexbox</h3>
            <p class="point-text">カードが横並びで均等配置されるか確認</p>
        </div>
    </div>
</body>
</html>
