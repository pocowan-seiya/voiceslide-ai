<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Slide 2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  width: 1920px;
  height: 1080px;
  font-family: 'Noto Sans JP', sans-serif;
  background: linear-gradient(135deg, #0B1F22 0%, #1A3A3A 100%);
  color: #E8EDE9;
  padding: 90px 120px !important;
  overflow: visible !important;
  position: relative;
}

/* grain texture */
body::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(245, 158, 11, 0.06) 0%, transparent 40%),
    radial-gradient(circle at 85% 75%, rgba(20, 184, 166, 0.08) 0%, transparent 45%);
  pointer-events: none;
}
body::after {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    repeating-radial-gradient(circle at 50% 50%, rgba(255,255,255,0.012) 0px, rgba(255,255,255,0.012) 1px, transparent 1px, transparent 3px);
  pointer-events: none;
  opacity: 0.6;
}

.container {
  position: relative;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  z-index: 2;
}

/* header */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-bottom: 40px;
}
.eyebrow {
  display: flex;
  align-items: center;
  gap: 18px;
  font-size: 15px;
  letter-spacing: 0.35em;
  color: #14B8A6;
  font-weight: 500;
  text-transform: uppercase;
}
.eyebrow .line {
  width: 60px;
  height: 1px;
  background: #14B8A6;
}
.slide-number {
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 14px;
  letter-spacing: 0.3em;
  color: rgba(232, 237, 233, 0.45);
  font-weight: 500;
}

/* heading area */
.heading-block {
  margin-top: 20px;
  max-width: 1400px;
}
.heading-block h1 {
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-weight: 900;
  font-size: 78px;
  line-height: 1.22;
  letter-spacing: 0.01em;
  color: #FFFFFF;
  word-break: keep-all;
  white-space: normal;
  overflow: visible;
}
.heading-block h1 .accent {
  background: linear-gradient(90deg, #F59E0B 0%, #FBBF24 100%);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
  text-shadow: 0 0 40px rgba(245, 158, 11, 0.25);
}
.subtitle {
  margin-top: 28px;
  font-size: 30px;
  font-weight: 500;
  color: #14B8A6;
  letter-spacing: 0.02em;
}

/* cards */
.cards {
  margin-top: auto;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 32px;
  padding-top: 60px;
}
.card {
  position: relative;
  background: rgba(255, 255, 255, 0.04);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 4px;
  padding: 48px 44px 52px;
  min-height: 340px;
  display: flex;
  flex-direction: column;
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.3), inset 0 1px 0 rgba(255,255,255,0.05);
  overflow: hidden;
}
.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 72px;
  height: 2px;
  background: #14B8A6;
}
.card.accent-card::before {
  background: #F59E0B;
  width: 120px;
  box-shadow: 0 0 20px rgba(245, 158, 11, 0.5);
}

.number-badge {
  font-family: 'Zen Kaku Gothic New', sans-serif;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.2em;
  color: #14B8A6;
  margin-bottom: 36px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.accent-card .number-badge {
  color: #F59E0B;
}
.number-badge .dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
}

.card-text {
  font-size: 28px;
  font-weight: 500;
  line-height: 1.55;
  color: #F3F5F3;
  letter-spacing: 0.01em;
  word-break: keep-all;
}
.card-text strong {
  font-weight: 700;
  color: #FFFFFF;
}
.accent-card .card-text strong {
  background: linear-gradient(90deg, #FBBF24, #F59E0B);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

.card-divider {
  margin-top: auto;
  padding-top: 28px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.card-divider .thin-line {
  flex: 1;
  height: 1px;
  background: rgba(255, 255, 255, 0.12);
}
.card-divider .tag {
  font-size: 24px;
  letter-spacing: 0.3em;
  color: rgba(232, 237, 233, 0.4);
  text-transform: uppercase;
  font-weight: 500;
}

/* decorative side element */
.side-mark {
  position: absolute;
  top: 50%;
  right: 40px;
  transform: translateY(-50%) rotate(90deg);
  font-size: 12px;
  letter-spacing: 0.5em;
  color: rgba(20, 184, 166, 0.3);
  font-weight: 500;
}

.glow-orb {
  position: absolute;
  width: 500px;
  height: 500px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(245, 158, 11, 0.12) 0%, transparent 60%);
  top: -150px;
  right: -100px;
  pointer-events: none;
}
</style>
</head>
<body>
  <div class="glow-orb"></div>
  <div class="side-mark">QUIET PRECISION</div>

  <div class="container">
    <div class="header">
      <div class="eyebrow">
        <span class="line"></span>
        <span>Quality Essentials</span>
      </div>
      <div class="slide-number">02 / 02</div>
    </div>

    <div class="heading-block">
      <h1>日本語が読みやすく、<br><span class="accent">自然に繋がる</span>こと</h1>
      <div class="subtitle">— 品質向上のための重要要素</div>
    </div>

    <div class="cards">
      <div class="card">
        <div class="number-badge"><span class="dot"></span>02 &nbsp;READABILITY</div>
        <div class="card-text">日本語が<strong>読みやすく</strong>、余白が詰まりすぎていないこと</div>
        <div class="card-divider">
          <span class="tag">Layout</span>
          <span class="thin-line"></span>
        </div>
      </div>

      <div class="card accent-card">
        <div class="number-badge"><span class="dot"></span>03 &nbsp;FLOW</div>
        <div class="card-text">音声の流れに合わせて、スライドが<strong>自然に繋がる</strong>こと</div>
        <div class="card-divider">
          <span class="tag">Key Message</span>
          <span class="thin-line"></span>
        </div>
      </div>

      <div class="card">
        <div class="number-badge"><span class="dot"></span>+ &nbsp;RESTORE</div>
        <div class="card-text">作成した動画を<strong>保存して、後から復元</strong>できることも確認</div>
        <div class="card-divider">
          <span class="tag">Reliability</span>
          <span class="thin-line"></span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
