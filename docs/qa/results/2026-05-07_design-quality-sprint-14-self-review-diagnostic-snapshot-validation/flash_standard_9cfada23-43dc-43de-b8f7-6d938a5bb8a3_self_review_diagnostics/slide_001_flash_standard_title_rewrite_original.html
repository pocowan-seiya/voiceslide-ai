<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Slide 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }
  body {
    font-family: 'Noto Sans JP', sans-serif;
    background: linear-gradient(135deg, #0A1628 0%, #1B3A5B 100%);
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 80px 100px !important;
  }

  /* Ambient glow orbs */
  .orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(80px);
    opacity: 0.35;
    pointer-events: none;
  }
  .orb-1 {
    width: 700px; height: 700px;
    background: radial-gradient(circle, #00B4D8 0%, transparent 70%);
    top: -200px; left: -150px;
  }
  .orb-2 {
    width: 600px; height: 600px;
    background: radial-gradient(circle, #48CAE4 0%, transparent 70%);
    bottom: -180px; right: -120px;
  }
  .orb-3 {
    width: 400px; height: 400px;
    background: radial-gradient(circle, #FFB703 0%, transparent 70%);
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    opacity: 0.15;
  }

  /* Waveform decoration */
  .waveform {
    position: absolute;
    left: 0; right: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    opacity: 0.5;
  }
  .waveform.top { top: 140px; }
  .waveform.bottom { bottom: 140px; }
  .wave-bar {
    width: 4px;
    background: linear-gradient(180deg, #00B4D8, #48CAE4);
    border-radius: 2px;
    box-shadow: 0 0 10px rgba(0, 180, 216, 0.6);
  }

  /* Particles */
  .particle {
    position: absolute;
    width: 6px; height: 6px;
    background: #48CAE4;
    border-radius: 50%;
    box-shadow: 0 0 12px #48CAE4;
  }
  .p1 { top: 18%; left: 14%; opacity: 0.7; }
  .p2 { top: 28%; right: 18%; opacity: 0.5; width: 4px; height: 4px; }
  .p3 { bottom: 24%; left: 20%; opacity: 0.6; width: 5px; height: 5px; }
  .p4 { bottom: 30%; right: 22%; opacity: 0.8; }
  .p5 { top: 40%; left: 8%; opacity: 0.4; width: 4px; height: 4px; }
  .p6 { top: 60%; right: 10%; opacity: 0.6; background: #FFB703; box-shadow: 0 0 12px #FFB703; }

  /* Content */
  .container {
    position: relative;
    z-index: 10;
    text-align: center;
    max-width: 1500px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 14px;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 0.35em;
    color: #FFB703;
    margin-bottom: 48px;
    text-transform: uppercase;
  }
  .eyebrow::before, .eyebrow::after {
    content: '';
    width: 60px; height: 1px;
    background: linear-gradient(90deg, transparent, #FFB703, transparent);
  }

  h1 {
    font-size: clamp(64px, 5.5vw, 96px);
    font-weight: 900;
    line-height: 1.25;
    letter-spacing: -0.01em;
    word-break: keep-all;
    white-space: normal;
    overflow: visible;
    max-width: 95%;
    margin: 0 auto 56px;
    padding: 0 20px;
    background: linear-gradient(135deg, #FFFFFF 0%, #48CAE4 60%, #00B4D8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    text-shadow: 0 0 80px rgba(72, 202, 228, 0.3);
  }

  .divider {
    width: 120px;
    height: 3px;
    margin: 0 auto 48px;
    background: linear-gradient(90deg, transparent, #00B4D8, #FFB703, #00B4D8, transparent);
    border-radius: 2px;
  }

  .subtitle {
    font-size: 34px;
    font-weight: 400;
    color: rgba(255, 255, 255, 0.85);
    line-height: 1.5;
    letter-spacing: 0.05em;
    word-break: keep-all;
  }

  /* Corner markers */
  .corner {
    position: absolute;
    width: 60px; height: 60px;
    border: 2px solid rgba(0, 180, 216, 0.5);
  }
  .corner.tl { top: 60px; left: 60px; border-right: none; border-bottom: none; }
  .corner.tr { top: 60px; right: 60px; border-left: none; border-bottom: none; }
  .corner.bl { bottom: 60px; left: 60px; border-right: none; border-top: none; }
  .corner.br { bottom: 60px; right: 60px; border-left: none; border-top: none; }

  /* Slide number */
  .slide-number {
    position: absolute;
    bottom: 50px;
    right: 80px;
    font-size: 16px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 0.2em;
    z-index: 20;
  }
  .slide-number span { color: #FFB703; }
</style>
</head>
<body>

  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>
  <div class="particle p5"></div>
  <div class="particle p6"></div>

  <div class="waveform top">
    <!-- generated bars -->
  </div>
  <div class="waveform bottom">
    <!-- generated bars -->
  </div>

  <div class="container">
    <div class="eyebrow">Voiceslide Movie</div>
    <h1>音声からスライド動画を作る<br>流れを確認します</h1>
    <div class="divider"></div>
    <p class="subtitle">ボイスライドムービーの品質評価用サンプル</p>
  </div>

  <div class="slide-number">01 <span>/</span> 02</div>

  <script>
    // Generate waveform bars
    const heights = [20,35,55,40,70,90,60,85,45,65,50,75,95,55,40,70,60,85,45,30,55,75,65,45,60,80,50,35,55,70,40,60,85,55,70,45,65,90,50,35,60,75,55,40,70,55,85,45,60,30];
    document.querySelectorAll('.waveform').forEach(wf => {
      heights.forEach((h, i) => {
        const bar = document.createElement('div');
        bar.className = 'wave-bar';
        bar.style.height = h + 'px';
        bar.style.opacity = 0.3 + (h/150);
        wf.appendChild(bar);
      });
      // mirror
      [...heights].reverse().forEach(h => {
        const bar = document.createElement('div');
        bar.className = 'wave-bar';
        bar.style.height = h + 'px';
        bar.style.opacity = 0.3 + (h/150);
        wf.appendChild(bar);
      });
    });
  </script>
</body>
</html>
