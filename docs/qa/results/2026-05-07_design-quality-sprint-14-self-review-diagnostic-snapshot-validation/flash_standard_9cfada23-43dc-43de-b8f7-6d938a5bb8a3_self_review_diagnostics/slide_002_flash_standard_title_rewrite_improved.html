<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8"/>
<title>Slide 2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  
  body {
    width: 1920px;
    height: 1080px;
    font-family: 'Noto Sans JP', sans-serif;
    background: linear-gradient(135deg, #0A1628 0%, #1B3A5B 100%);
    color: #fff;
    overflow: hidden;
    position: relative;
    padding: 120px 160px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .wave {
    position: absolute;
    left: 0;
    right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent 0%, rgba(0, 180, 216, 0.6) 30%, rgba(72, 202, 228, 0.8) 50%, rgba(0, 180, 216, 0.6) 70%, transparent 100%);
  }
  .wave-1 { top: 15%; }
  .wave-2 { bottom: 15%; opacity: 0.5; }

  .glow-orb {
    position: absolute;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.35;
  }
  .orb-1 {
    width: 700px; height: 700px;
    background: #00B4D8;
    top: -250px; right: -200px;
  }
  .orb-2 {
    width: 600px; height: 600px;
    background: #FFB703;
    bottom: -200px; left: -150px;
    opacity: 0.15;
  }

  .eyebrow {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.5em;
    color: #48CAE4;
    text-transform: uppercase;
    margin-bottom: 64px;
    text-align: center;
    position: relative;
    z-index: 2;
  }

  .eyebrow::before, .eyebrow::after {
    content: '';
    display: inline-block;
    width: 80px;
    height: 1px;
    background: #48CAE4;
    vertical-align: middle;
    margin: 0 28px;
  }

  h1.main {
    font-size: 118px;
    font-weight: 900;
    line-height: 1.3;
    text-align: center;
    letter-spacing: 0.02em;
    max-width: 100%;
    margin: 0 auto;
    word-break: keep-all;
    background: linear-gradient(135deg, #FFFFFF 0%, #48CAE4 50%, #FFB703 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    position: relative;
    z-index: 2;
  }

  .accent-line {
    width: 160px;
    height: 5px;
    background: linear-gradient(90deg, #00B4D8, #FFB703);
    margin: 80px auto 0;
    border-radius: 2px;
    position: relative;
    z-index: 2;
  }

  .sub-caption {
    margin-top: 48px;
    text-align: center;
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 0.25em;
    color: rgba(255, 255, 255, 0.55);
    position: relative;
    z-index: 2;
  }

  .slide-number {
    position: absolute;
    bottom: 50px;
    right: 80px;
    font-size: 16px;
    font-weight: 700;
    color: rgba(255, 255, 255, 0.4);
    letter-spacing: 0.2em;
    z-index: 3;
  }

  .brand {
    position: absolute;
    bottom: 50px;
    left: 80px;
    font-size: 24px;
    font-weight: 700;
    color: rgba(72, 202, 228, 0.6);
    letter-spacing: 0.3em;
    z-index: 3;
  }
</style>
</head>
<body>
<div class="glow-orb orb-1"></div>
<div class="glow-orb orb-2"></div>
<div class="wave wave-1"></div>
<div class="wave wave-2"></div>
<div class="eyebrow">Key Message</div>
<h1 class="main">音声の流れに沿って、<br/>スライドが自然に繋がる。</h1>
<div class="accent-line"></div>
<div class="sub-caption">S E A M L E S S &nbsp;&nbsp; N A R R A T I V E &nbsp;&nbsp; F L O W</div>
<div class="brand">SONIC FLOW</div>
<div class="slide-number">02 / 02</div>
</body>
</html>
